<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1442">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jaafar ♥ Audrey">
<meta name="robots" content="noindex, nofollow">
<title>Jaafar ♥ Audrey</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preload" href="./fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./styles.css?v=2.3.0">
</head>
<body>
<!-- Ciel animé (étoiles, étoiles filantes) -->
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="sky" aria-hidden="true"></canvas>

<!-- Écran de chargement : visible tant que l'appli n'a pas démarré -->
<div id="boot" class="boot" role="status">
  <svg class="boot-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  <p class="boot-title">Jaafar &amp; Audrey</p>
  <p class="boot-slow" id="boot-slow" hidden>
    Ça prend plus de temps que prévu.<br>
    <button type="button" class="btn ghost" onclick="location.reload()">Recharger</button>
  </p>
  <noscript><p class="boot-slow">Active JavaScript pour ouvrir notre appli.</p></noscript>
</div>

<div id="root"></div>
<div id="fx" aria-hidden="true"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script>
  // mémorise le dossier de l'appli (utilisé par 404.html pour les liens profonds)
  try { localStorage.setItem('compleo-base', location.pathname.replace(/[^/]*$/, '')); } catch (e) {}
  // Filet de sécurité : si l'appli ne démarre pas, on propose de recharger (jamais d'écran vide)
  setTimeout(function () {
    if (!window.__compleoReady) { var s = document.getElementById('boot-slow'); if (s) s.hidden = false; }
  }, 9000);
</script>
<script src="./config.js?v=2.3.0"></script>
<script src="./vendor/supabase.js"></script>
<script type="module" src="./js/app.js?v=2.3.0"></script>
</body>
</html>
