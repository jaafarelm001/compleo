name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Si les secrets SUPABASE_URL et SUPABASE_ANON_KEY existent dans le dépôt,
      # config.js est généré à partir d'eux. Sinon, le config.js du dépôt est utilisé.
      - name: Générer config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "window.LOVE_CONFIG = {\n  SUPABASE_URL: '%s',\n  SUPABASE_ANON_KEY: '%s'\n};\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > config.js
            echo "config.js généré depuis les secrets du dépôt"
          else
            echo "Pas de secrets : utilisation du config.js du dépôt"
          fi

      # On ne publie que les fichiers du site (pas les scripts SQL)
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css config.js manifest.webmanifest icon.svg icon-512.png apple-touch-icon.png _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
