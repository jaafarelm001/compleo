name: Garder Supabase éveillé

# Supabase met en pause les projets gratuits après 7 jours sans activité.
# Ce workflow appelle la base tous les 3 jours pour l'éviter.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Appeler Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" config.js)
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' || true)
            echo "Essai $i : HTTP $code $(cat /tmp/r 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase ne répond pas. Vérifie sur supabase.com que le projet n'est pas en pause."
          exit 1

      # GitHub désactive les tâches planifiées d'un dépôt sans commit depuis 60 jours :
      # un commit vide tous les ~45 jours garde ce workflow actif pour toujours.
      - name: Garder ce workflow actif
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Dernier commit il y a $days jours"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive automatique"
            git push
          fi
